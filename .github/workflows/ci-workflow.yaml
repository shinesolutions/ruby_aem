---
name: CI
on:
  # Branches only: a release tag points at a commit already built when it
  # was pushed to main
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Cancel a branch's in-progress run when a newer commit is pushed, main
# excepted so that every main commit keeps a complete CI result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    # Same-repo PRs are already built by the push run on their branch, so only
    # run for PRs from forks. Also skip the release's "Bump up to next
    # pre-release version" commit, which only changes version strings
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository) &&
      !startsWith(github.event.head_commit.message || '',
                  'Bump up to next pre-release version')
    # Fail a hung build instead of running to GitHub's 6 hour default
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SHINEOPENSOURCE_GITHUB_TOKEN }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: 'make ci'
          image: shinesolutions/aem-platform-buildenv:6.5.0
          shell: bash
