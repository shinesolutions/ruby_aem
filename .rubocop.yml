inherit_mode:
  merge:
    - Exclude
AllCops:
  TargetRubyVersion: 3.2
  DisplayCopNames: true
  NewCops: enable
  Exclude:
    - .bundle/*
    - bin/*
Layout/LineLength:
  Max: 280
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Exclude:
    - "**/**/*_spec.rb"
Metrics/ClassLength:
  Max: 300
Metrics/MethodLength:
  Max: 40
Metrics/ModuleLength:
  Max: 120
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Naming/AccessorMethodName:
  Enabled: false
# enable Naming/PredicatePrefix as part of ruby_aem v2
Naming/PredicatePrefix:
  Enabled: false
Style/BlockDelimiters:
  Enabled: false
Style/ExpandPathArguments:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Style/RaiseArgs:
  EnforcedStyle: compact
